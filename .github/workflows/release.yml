name: release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The tag, manifest.json and the csproj must agree, or RoRoRo would offer an update that
      # installs a different version than it names.
      - name: Tag matches manifest and csproj
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $manifest = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $csproj = ([xml](Get-Content Ur-Score.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($manifest -ne $tag -or $csproj -ne $tag) { throw "tag $tag, manifest.json $manifest, csproj $csproj must match" }

      - name: Test
        shell: pwsh
        run: dotnet test tests/Ur-Score.Tests.csproj -c Release

      - name: Build plugin artifacts
        shell: pwsh
        run: ./build/build-plugin.ps1

      # The release page leads with this version's CHANGELOG section and how to install it. No section, no
      # release: a page that says nothing about what changed is what this step exists to prevent. It runs after
      # the build because build-plugin.ps1 clears artifacts/.
      - name: Release notes from the CHANGELOG
        shell: pwsh
        run: ./build/release-notes.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File
          Get-Content artifacts/manifest.sha256

      # gh, not softprops/action-gh-release: on 2026-09-17 that action's uploader stalled or errored on
      # plugin.zip three runs in a row (v0.3.5) while gh uploads to the same repo worked. The release
      # stays a draft until every file is on it, so "latest" never points at a release without
      # plugin.zip, and the two recipe files the setup guide links to (releases/latest/download/) ride
      # along instead of being attached by hand. A draft left by a failed run is reused.
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = '${{ github.ref_name }}'
          # Every recipe in recipes/, not a list that goes stale: the setup guide links to
          # releases/latest/download/<recipe>, and a recipe added later must ride the next release by itself.
          $recipes = @(Get-ChildItem 'recipes/*.recipe.json' | ForEach-Object { $_.FullName })
          if ($recipes.Count -eq 0) { throw 'no recipes to upload' }
          $files = @('artifacts/manifest.json', 'artifacts/manifest.sha256', 'artifacts/plugin.zip', 'build/install.ps1') + $recipes
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "missing $file" } }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $pre = @(if ($tag -match 'rc|beta') { '--prerelease' })
            gh release create $tag --draft --verify-tag --notes-file artifacts/release-notes.md --generate-notes --title $tag @pre
            if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }
          } else {
            # A draft left by a failed run still gets this run's notes.
            gh release edit $tag --notes-file artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit $tag failed" }
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "uploading to $tag failed three times" }
            Start-Sleep -Seconds (30 * $attempt)
          }

          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "publishing $tag failed" }
          gh release view $tag --json assets --jq '.assets[].name'
