name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: dotnet build tests/Ur-Score.Tests.csproj -c Release -warnaserror

      - name: Test
        shell: pwsh
        run: dotnet test tests/Ur-Score.Tests.csproj -c Release --no-build

      - name: The by-hand installer (build/install.ps1) under Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/smoke/checks/install-check.ps1

      - name: The current version has release notes in the CHANGELOG
        shell: pwsh
        run: ./build/release-notes.ps1 -Version (Get-Content manifest.json -Raw | ConvertFrom-Json).version
